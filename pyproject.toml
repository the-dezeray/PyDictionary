[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydictionary"
version = "0.1.0"
description = "A feature-rich terminal dictionary application with pronunciation, synonyms, and word games"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "the-dezeray", email = "your.email@example.com"},
]
maintainers = [
    {name = "the-dezeray", email = "your.email@example.com"},
]
keywords = ["dictionary", "terminal", "cli", "pronunciation", "synonyms", "wordnet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]
dependencies = [
    "art>=6.5",
    "fuzzywuzzy>=0.18.0",
    "gtts>=2.5.4",
    "nltk>=3.9.1",
    "pygame>=2.6.1",
    "pynput>=1.8.1",
    "rapidfuzz>=3.14.1",
    "requests>=2.32.5",
    "rich>=14.1.0",
]

[project.urls]
Homepage = "https://github.com/the-dezeray/PyDictionary"
Documentation = "https://github.com/the-dezeray/PyDictionary#readme"
Repository = "https://github.com/the-dezeray/PyDictionary.git"
"Bug Tracker" = "https://github.com/the-dezeray/PyDictionary/issues"

[project.scripts]
pydictionary = "pyDictionary.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyDictionary"]
